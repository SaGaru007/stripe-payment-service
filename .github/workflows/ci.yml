name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (Java 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # No test sources are checked in yet, so this job verifies that the
      # project compiles and packages cleanly - the failure mode that actually
      # breaks this service. Add `./mvnw -B verify` once tests exist.
      - name: Package
        run: ./mvnw -B -DskipTests package
